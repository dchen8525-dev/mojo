name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: mojo targets Windows terminals (PowerShell shell
        # handling, CRLF, ANSI probing), so the suite must stay green there.
        os: [ubuntu-latest, windows-latest]
        node: [20.x, 22.x]
    env:
      # No test launches Electron; skip its ~100MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test
